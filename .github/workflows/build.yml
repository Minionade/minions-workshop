name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - 1.21.1-fabric
          - 1.21.1-neoforge
          - 26.1.2-fabric
          - 26.1.2-neoforge
          - 26.3-fabric
          - 26.3-neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build target
        shell: pwsh
        run: .\gradlew.bat --console=plain --no-daemon ":${{ matrix.target }}:build"
      - uses: actions/upload-artifact@v4
        with:
          name: minions-workshop-${{ matrix.target }}
          path: versions\${{ matrix.target }}\build\libs\*.jar
          if-no-files-found: error
